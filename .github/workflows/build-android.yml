name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-pwa/**'
      - '.github/workflows/build-android.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build web bundle & sync Capacitor Android
        working-directory: mobile-pwa
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build installable Android APK
        working-directory: mobile-pwa/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../Quran-Reel-Generator-Android.apk
          ls -lh ../../Quran-Reel-Generator-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Quran-Reel-Generator-Android
          path: Quran-Reel-Generator-Android.apk

      - name: Publish Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          make_latest: true
          files: Quran-Reel-Generator-Android.apk
