name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Build frontend & run Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install FFmpeg & DejaVu font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python syntax
        run: python -m compileall -q app.py draft_store.py renderer.py quran.py quran_assets.py audio_sources.py ayah_data.py reel_planner.py reciter_manager.py pause_detect.py quran_display.py scripts/ tests/

      - name: Unit tests
        run: python -m pytest -q

      - name: Preflight (environment only)
        run: |
          python -c "from pathlib import Path; import draft_store; draft_store.ensure_layout(Path('.'))"
          python scripts/preflight.py --skip-data
