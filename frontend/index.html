<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Developer. Mohamed Ali" />
    <link rel="author" href="https://github.com/devMohamedA1i" />
    <title>Quran Reel Generator</title>
    <script>
      (function () {
        try {
          var l = localStorage.getItem('qvs.lang') || 'en';
          if (l !== 'ar') l = 'en';
          document.documentElement.lang = l;
          document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
